name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found, skipping"
          fi
      
      - name: Run data quality tests
        run: |
          if [ -f tests/test_quality.py ]; then
            python tests/test_quality.py
          else
            echo "⚠️ No tests found, skipping"
          fi
      
      - name: Validate SQL syntax
        run: |
          for file in queries/*.sql; do
            if [ -f "$file" ]; then
              echo "✅ Validating $file"
              # Basic SQL syntax check
              python -c "import sqlparse; sqlparse.parse(open('$file').read())" || echo "⚠️ SQL syntax issues in $file"
            fi
          done
      
      - name: Check Python code formatting
        run: |
          pip install black
          black --check . --exclude "venv|.git|__pycache__" || echo "⚠️ Formatting issues found"
      
      - name: Check Python code quality
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.git,__pycache__
      
      - name: Verify project structure
        run: |
          echo "📂 Checking project structure..."
          [ -d "kafka/producers" ] && echo "✅ Kafka producers found"
          [ -d "kafka/consumers" ] && echo "✅ Kafka consumers found"
          [ -d "airflow/dags" ] && echo "✅ Airflow DAGs found"
          [ -d "dbt/models" ] && echo "✅ dbt models found"
          echo "✅ Project structure verified!"
      
      - name: Run security checks
        run: |
          pip install bandit
          bandit -r . -ll -f json -o bandit-report.json || echo "⚠️ Security issues found"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            bandit-report.json
            test-reports/
