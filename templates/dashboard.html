<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Dashboard</title>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .metric-card { background: white; padding: 20px; border-radius: 12px; text-align: center; }
        .number { font-size: 32px; font-weight: 700; color: #2c3e50; }
        .label { font-size: 14px; color: #7f8c8d; margin-top: 5px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin: 3px; }
        .status-badge.completed { background: #d4edda; color: #155724; }
        .status-badge.pending { background: #fff3cd; color: #856404; }
        .status-badge.shipped { background: #cce5ff; color: #004085; }
        .status-badge.cancelled { background: #f8d7da; color: #721c24; }
        .region-bar { display: flex; align-items: center; margin: 5px 0; }
        .region-bar .name { width: 80px; }
        .region-bar .bar { flex: 1; height: 20px; background: #ecf0f1; border-radius: 10px; overflow: hidden; margin: 0 10px; }
        .region-bar .bar .fill { height: 100%; background: #3498db; border-radius: 10px; }
        .region-bar .value { width: 80px; text-align: right; font-weight: 500; }
        .live-tag { background: #ff4757; color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .refresh-btn { background: white; color: #667eea; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .chart-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .orders-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .orders-table th { text-align: left; padding: 10px; border-bottom: 2px solid #ecf0f1; }
        .orders-table td { padding: 10px; border-bottom: 1px solid #ecf0f1; }
        .auto-refresh { background: #e8f5e9; padding: 10px; border-radius: 8px; text-align: center; color: #2e7d32; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📊 E-Commerce Analytics</h1>
            <div><span class="live-tag">🔴 LIVE</span></div>
        </div>
        <div style="text-align: right;">
            <button class="refresh-btn" onclick="fetchMetrics()">🔄 Refresh Now</button>
            <div style="font-size: 12px; opacity: 0.8; margin-top: 10px;" id="updated">Loading...</div>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card"><div class="number" id="totalOrders">-</div><div class="label">Total Orders</div></div>
        <div class="metric-card"><div class="number" id="totalRevenue">-</div><div class="label">Total Revenue ($)</div></div>
        <div class="metric-card"><div class="number" id="avgOrder">-</div><div class="label">Avg Order Value ($)</div></div>
        <div class="metric-card"><div class="number" id="statusCount">-</div><div class="label">Statuses</div></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="chart-card"><h3>📈 Revenue by Region</h3><div id="regionChart"></div></div>
        <div class="chart-card"><h3>📊 Orders by Status</h3><div id="statusChart"></div></div>
    </div>

    <div class="chart-card">
        <h3>🕐 Recent Orders</h3>
        <table class="orders-table">
            <thead><tr><th>Order ID</th><th>Amount</th><th>Status</th><th>Region</th><th>Date</th></tr></thead>
            <tbody id="recentOrders"></tbody>
        </table>
    </div>

    <div class="auto-refresh" id="refreshStatus">
        🔄 Live | Auto-updating every 5 seconds
    </div>
</div>

<script>
async function fetchMetrics() {
    try {
        // ✅ Add timestamp to force fresh data
        const timestamp = new Date().getTime();
        const response = await fetch('/api/metrics?t=' + timestamp);
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);
        
        document.getElementById('totalOrders').textContent = data.total_orders.toLocaleString();
        document.getElementById('totalRevenue').textContent = data.total_revenue.toFixed(2);
        const avg = data.total_orders > 0 ? (data.total_revenue / data.total_orders).toFixed(2) : '0';
        document.getElementById('avgOrder').textContent = avg;
        document.getElementById('statusCount').textContent = data.status_counts.length;
        document.getElementById('updated').innerHTML = '🕐 Last Updated: ' + new Date().toLocaleTimeString();

        let statusHtml = '';
        data.status_counts.forEach(s => statusHtml += `<span class="status-badge ${s.status}">${s.status}: ${s.count}</span>`);
        document.getElementById('statusChart').innerHTML = statusHtml;

        const maxRevenue = Math.max(...data.region_revenue.map(r => r.revenue), 1);
        let regionHtml = '';
        data.region_revenue.forEach(r => {
            const pct = (r.revenue / maxRevenue * 100).toFixed(1);
            regionHtml += `<div class="region-bar"><span class="name">${r.region}</span><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="value">$${r.revenue.toFixed(2)}</span></div>`;
        });
        document.getElementById('regionChart').innerHTML = regionHtml;

        let ordersHtml = '';
        data.recent_orders.forEach(o => ordersHtml += `<tr><td>#${o.order_id}</td><td>$${o.amount}</td><td><span class="status-badge ${o.status}">${o.status}</span></td><td>${o.region}</td><td>${o.date}</td></tr>`);
        document.getElementById('recentOrders').innerHTML = ordersHtml;

        document.getElementById('refreshStatus').innerHTML = '✅ Data loaded at: ' + new Date().toLocaleTimeString() + ' | Auto-updating every 5 seconds';

    } catch (error) {
        document.getElementById('updated').innerHTML = '❌ Error loading data';
    }
}

// Load immediately
fetchMetrics();

// Auto-refresh EVERY 5 seconds (instead of 30)
setInterval(fetchMetrics, 5000);
</script>
</body>
</html>
